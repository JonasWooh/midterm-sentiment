[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "midterm-sentiment"
version = "1.0.0"
description = "2026 US midterms: voter-issue discovery, issue sentiment, prediction-market odds and a mid-term equity basket"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "statsmodels", "matplotlib", "pyyaml", "pyarrow",
                "vaderSentiment", "requests",
                "torch", "transformers>=4.44,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
