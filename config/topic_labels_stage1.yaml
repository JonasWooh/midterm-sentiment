# Stage-1 (full-corpus) NMF topics, K = 35 (max mean NPMI over the K grid).
# Each topic is classified as `issue` (policy/performance content) or `process`
# (horse race, candidates, primaries, results, election logistics, party labels,
# subreddit meta-text, generic one-word themes such as 'support'/'America', miscellany). Labels were assigned by reading the top-15
# terms and eight representative documents (outputs/tables/topics_raw.csv)
# BEFORE any sentiment, prediction-market or equity data were examined.
# Stage 2 removes vocabulary whose stage-1 loading mass is >= 80% in `process`
# topics, so that the issue model is not dominated by electoral vocabulary.
topics:
  0:  {label: "Senate races (MI, TX, AK, ME, GA)", kind: process}
  1:  {label: "Trump administration, economy, tariffs, prices", kind: issue}
  2:  {label: "House races and seats", kind: process}
  3:  {label: "Subreddit meta / moderator text", kind: process}
  4:  {label: "Primaries and primary results", kind: process}
  5:  {label: "Democrats win / flip / hold seats", kind: process}
  6:  {label: "Iran war, Strait of Hormuz, Israel", kind: issue}
  7:  {label: "Supreme Court, maps, mail-in ballots", kind: issue}
  8:  {label: "Republicans win / lose, warnings", kind: process}
